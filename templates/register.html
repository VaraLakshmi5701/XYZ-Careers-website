<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Register</title>
        {% include 'bootstrap.html' %}
    </head>
    <body>
        <div class="site-container">
            <div class="row justify-content-center">
                <div class="col-md-5">
                    <div class="card shadow-sm border-0 mt-5">
                        <div class="card-body p-4 p-md-5">
                            <h2 class="mb-3 text-center">Create your account</h2>
                            <p class="text-center text-muted mb-4">Join and start exploring opportunities</p>

                            {% if error %}
                                <div class="alert alert-danger" role="alert">{{ error }}</div>
                            {% endif %}

                            <form method="POST" action="/register">
                                <div class="mb-3">
                                    <label for="username" class="form-label">Username</label>
                                    <input type="text" class="form-control" id="username" name="username" required>
                                </div>
                                <div class="mb-4">
                                    <label for="password" class="form-label">Password</label>
                                    <input type="password" class="form-control" id="password" name="password" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Register</button>
                            </form>

                            <div class="text-center mt-4">
                                <small class="text-muted">Already registered?</small>
                                <a href="/login" class="d-block mt-2">Login here</a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
