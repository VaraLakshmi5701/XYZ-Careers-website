<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
<style>
:root{
  --bg: #f8fafc;
  --card: #ffffff;
  --muted: #6b7280;
  --primary: #0d6efd;
  --max-width: 1100px;
  --container-padding: 1rem;
}
*{box-sizing:border-box}
body{
  font-family:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial;
  background:var(--bg);
  color:#111827;
  margin:0;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}
.site-container{
  max-width:var(--max-width);
  margin:0 auto;
  padding:2rem var(--container-padding) 4rem;
}
#banner{
  width:100%;
  height:350px;
  object-fit:cover;
  border-radius:8px;
  box-shadow:0 6px 18px rgba(15,23,42,0.08);
  display:block;
  margin:1rem 0;
}
.navbar{
  background:linear-gradient(90deg, rgba(255,255,255,0.6), rgba(255,255,255,0.8));
  box-shadow:0 1px 0 rgba(0,0,0,0.04);
}
.brand{
  font-weight:600;
  color:var(--primary) !important;
}
h1,h2,h3,h4{margin-top:0}
.job-card{
  background:var(--card);
  border-radius:8px;
  padding:1rem;
  margin-bottom:1rem;
  display:flex;
  align-items:center;
  justify-content:space-between;
  box-shadow:0 4px 14px rgba(2,6,23,0.06);
}
.job-meta{color:var(--muted); font-size:0.95rem}
.btn-primary{
  background:linear-gradient(180deg,var(--primary), #0047b3);
  border: none;
  box-shadow: 0 6px 18px rgba(13,110,253,0.12);
}
.form-control, input[type='text'], input[type='email'], textarea{
  border-radius:6px;
  border:1px solid #e6e9ef;
  padding:0.6rem;
}
@media (max-width:768px){
  #banner{height:200px}
  .job-card{flex-direction:column; align-items:flex-start}
}
</style>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
